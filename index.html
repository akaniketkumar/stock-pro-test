<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockPro Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f9; }
        h1 { color: #333; }
        p { font-size: 18px; color: #666; }
        #backend-status { font-weight: bold; }
    </style>
</head>
<body>

    <h1>🚀 StockPro Dashboard</h1>
    <p>Backend Connection Status:</p>
    <p id="backend-status" style="color: orange;">Connecting to server...</p>

    <script>
        // Hum backend ke sahi route ko call kar rahe hain
        fetch('http://localhost:5000/get-market-data')
            .then(response => response.json())
            .then(data => {
                document.getElementById('backend-status').innerText = data.message;
                document.getElementById('backend-status').style.color = "green";
            })
            .catch(error => {
                document.getElementById('backend-status').innerText = "Connection failed!";
                document.getElementById('backend-status').style.color = "red";
            });
    </script>

</body>
</html>
